<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f8dce7">

<title>For Ritumonnnn ♡</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;

    font-family:
        Arial,
        sans-serif;

    color:#54283b;

    background:#f8dce7;
}


/* =========================================================
   PAGE SYSTEM
========================================================= */

.page{
    position:fixed;
    inset:0;

    display:none;

    width:100%;
    height:100vh;

    align-items:center;
    justify-content:center;

    padding:20px;

    overflow-y:auto;

    text-align:center;

    background:
        radial-gradient(
            circle at 12% 10%,
            rgba(255,255,255,.94),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(231,202,255,.35),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            rgba(255,247,251,.94),
            rgba(250,211,225,.96)
        );

    backdrop-filter:blur(8px);

    z-index:2;
}

#home{
    display:flex;
}

body:has(.page:target) #home{
    display:none;
}

.page:target{
    display:flex;

    animation:
        pageIn
        .65s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes pageIn{

    from{
        opacity:0;
        transform:scale(.985);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.container{
    position:relative;

    z-index:5;

    width:min(94%,540px);
}

.small{
    margin-bottom:14px;

    color:#92707e;

    font-size:10px;

    letter-spacing:5px;

    text-transform:uppercase;
}

h1,
h2{
    margin:0;

    font-family:Georgia,serif;

    color:#b52e62;
}

.subtitle{
    color:#765967;

    font-size:14px;

    line-height:1.7;
}

.next-button{
    display:inline-block;

    margin-top:22px;

    padding:15px 29px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #c9346d,
            #a92359
        );

    color:#fff;

    font-size:14px;

    font-weight:bold;

    text-decoration:none;

    box-shadow:
        0 12px 28px
        rgba(166,40,91,.25);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.next-button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 16px 32px
        rgba(166,40,91,.30);
}

.next-button:active{
    transform:scale(.95);
}


/* =========================================================
   FLOATING HEART BACKGROUND
========================================================= */

.ambient{
    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:1;
}

.heart{
    position:absolute;

    bottom:-60px;

    color:rgba(190,54,105,.22);

    font-size:20px;

    animation:
        heartFloat
        linear
        infinite;
}

.heart:nth-child(1){
    left:5%;
    animation-duration:12s;
}

.heart:nth-child(2){
    left:16%;
    animation-duration:16s;
    animation-delay:3s;
    font-size:13px;
}

.heart:nth-child(3){
    left:28%;
    animation-duration:11s;
    animation-delay:6s;
    font-size:27px;
}

.heart:nth-child(4){
    left:41%;
    animation-duration:15s;
    animation-delay:1s;
    font-size:15px;
}

.heart:nth-child(5){
    left:53%;
    animation-duration:13s;
    animation-delay:5s;
    font-size:25px;
}

.heart:nth-child(6){
    left:66%;
    animation-duration:17s;
    animation-delay:2s;
    font-size:14px;
}

.heart:nth-child(7){
    left:77%;
    animation-duration:12s;
    animation-delay:7s;
    font-size:23px;
}

.heart:nth-child(8){
    left:90%;
    animation-duration:15s;
    animation-delay:4s;
    font-size:17px;
}

@keyframes heartFloat{

    0%{
        opacity:0;

        transform:
            translateY(0)
            translateX(0)
            rotate(0)
            scale(.7);
    }

    12%{
        opacity:.45;
    }

    45%{
        transform:
            translateY(-45vh)
            translateX(18px)
            rotate(12deg)
            scale(1);
    }

    75%{
        transform:
            translateY(-75vh)
            translateX(-15px)
            rotate(-10deg)
            scale(1.08);
    }

    100%{
        opacity:0;

        transform:
            translateY(-115vh)
            translateX(10px)
            rotate(20deg)
            scale(.8);
    }
}


/* =========================================================
   SPARKLES
========================================================= */

.sparkle{
    position:absolute;

    color:rgba(183,91,127,.25);

    animation:
        sparkle
        3s
        ease-in-out
        infinite;
}

.sparkle:nth-child(9){
    left:12%;
    top:25%;
}

.sparkle:nth-child(10){
    left:84%;
    top:18%;
    animation-delay:1s;
}

.sparkle:nth-child(11){
    left:73%;
    top:65%;
    animation-delay:1.7s;
}

.sparkle:nth-child(12){
    left:24%;
    top:75%;
    animation-delay:2.2s;
}

@keyframes sparkle{

    0%,100%{
        opacity:.1;
        transform:scale(.7) rotate(0);
    }

    50%{
        opacity:.65;
        transform:scale(1.3) rotate(90deg);
    }
}


/* =========================================================
   TEDDY
========================================================= */

.teddy{
    position:absolute;

    width:100px;
    height:132px;

    left:50%;
    bottom:7px;

    transform:translateX(-50%);

    z-index:8;

    pointer-events:none;

    animation:
        teddyFloat
        3s
        ease-in-out
        infinite;
}

@keyframes teddyFloat{

    0%,100%{
        transform:
            translateX(-50%)
            translateY(0);
    }

    50%{
        transform:
            translateX(-50%)
            translateY(-7px);
    }
}

.teddy .ear{
    position:absolute;

    width:37px;
    height:37px;

    top:3px;

    background:#b97958;

    border-radius:50%;
}

.teddy .ear.left{
    left:5px;
}

.teddy .ear.right{
    right:5px;
}

.teddy .ear::after{
    content:"";

    position:absolute;

    inset:8px;

    background:#eab09b;

    border-radius:50%;
}

.teddy-head{
    position:absolute;

    width:82px;
    height:76px;

    left:9px;
    top:15px;

    background:#c48866;

    border-radius:48%;

    box-shadow:
        inset -6px -7px
        rgba(100,55,40,.08);
}

.eye{
    position:absolute;

    width:7px;
    height:9px;

    top:28px;

    background:#3b2420;

    border-radius:50%;

    animation:
        blink
        4.5s
        infinite;
}

.eye.left{
    left:24px;
}

.eye.right{
    right:24px;
}

@keyframes blink{

    0%,45%,48%,100%{
        transform:scaleY(1);
    }

    46%,47%{
        transform:scaleY(.1);
    }
}

.muzzle{
    position:absolute;

    width:37px;
    height:28px;

    left:22px;
    top:41px;

    background:#eab09b;

    border-radius:50%;
}

.nose{
    position:absolute;

    width:11px;
    height:8px;

    left:13px;
    top:7px;

    background:#40251f;

    border-radius:50%;
}

.mouth{
    position:absolute;

    width:13px;
    height:6px;

    left:12px;
    top:14px;

    border-bottom:
        2px solid #40251f;

    border-radius:50%;
}

.teddy-body{
    position:absolute;

    width:70px;
    height:62px;

    left:15px;
    top:77px;

    background:#b97958;

    border-radius:
        45% 45% 35% 35%;
}

.belly{
    position:absolute;

    width:43px;
    height:38px;

    left:13px;
    top:10px;

    background:#eab09b;

    border-radius:50%;
}

.teddy-heart{
    position:absolute;

    left:12px;
    top:7px;

    color:#d83d71;

    font-size:20px;
}

.arm{
    position:absolute;

    width:23px;
    height:42px;

    top:82px;

    background:#b97958;

    border-radius:50%;
}

.arm.left{
    left:-2px;

    transform:rotate(28deg);
}

.arm.right{
    right:-2px;

    transform:rotate(-28deg);
}

.foot{
    position:absolute;

    width:29px;
    height:19px;

    top:124px;

    background:#a96b50;

    border-radius:50%;
}

.foot.left{
    left:10px;
}

.foot.right{
    right:10px;
}


/* =========================================================
   HOME
========================================================= */

.name{
    margin:20px 0 5px;

    font-family:Georgia,serif;

    font-size:
        clamp(76px,22vw,112px);

    line-height:.9;

    color:#bd3167;

    letter-spacing:-3px;
}

.age{
    margin-top:12px;

    font-size:22px;

    color:#633849;
}


/* =========================================================
   BALLOONS
========================================================= */

.balloon-heading{
    margin-bottom:10px;

    font-size:
        clamp(43px,12vw,64px);

    line-height:.95;
}

.balloon-stage{
    position:relative;

    width:100%;
    height:390px;

    margin-top:5px;
}

.balloon{
    position:absolute;

    width:70px;
    height:90px;

    border-radius:50%;

    cursor:pointer;

    z-index:10;

    box-shadow:
        inset -10px -12px 18px
        rgba(0,0,0,.08),

        inset 9px 7px 14px
        rgba(255,255,255,.24),

        0 12px 25px
        rgba(80,30,50,.12);

    -webkit-tap-highlight-color:transparent;

    animation:
        balloonFloat
        var(--speed)
        ease-in-out
        infinite;
}

.balloon::before{
    content:"";

    position:absolute;

    width:15px;
    height:30px;

    left:12px;
    top:12px;

    background:
        rgba(255,255,255,.48);

    border-radius:50%;

    transform:rotate(24deg);
}

.balloon-knot{
    position:absolute;

    left:50%;
    bottom:-7px;

    width:12px;
    height:12px;

    transform:
        translateX(-50%)
        rotate(45deg);

    background:inherit;

    z-index:-1;
}

.balloon-string{
    position:absolute;

    left:50%;
    top:88px;

    width:1px;
    height:85px;

    background:
        rgba(91,60,70,.42);

    transform-origin:top center;

    animation:
        stringSway
        2.2s
        ease-in-out
        infinite;
}

@keyframes stringSway{

    0%,100%{
        transform:rotate(-2deg);
    }

    50%{
        transform:rotate(3deg);
    }
}

.balloon1{
    left:7%;
    top:60px;

    background:#f47fa5;

    --speed:3.4s;

    animation-delay:-1s;
}

.balloon2{
    left:40%;
    top:5px;

    background:#a79cf4;

    --speed:4.1s;

    animation-delay:-2s;
}

.balloon3{
    right:7%;
    top:65px;

    background:#ffd05b;

    --speed:3.7s;

    animation-delay:-.5s;
}

.balloon4{
    left:20%;
    top:215px;

    background:#69cbbb;

    --speed:4.5s;

    animation-delay:-2.7s;
}

.balloon5{
    right:20%;
    top:220px;

    background:#ff9877;

    --speed:3.9s;

    animation-delay:-1.5s;
}

@keyframes balloonFloat{

    0%,100%{
        transform:
            translate(0,0)
            rotate(-2deg);
    }

    25%{
        transform:
            translate(7px,-13px)
            rotate(3deg);
    }

    50%{
        transform:
            translate(-5px,-20px)
            rotate(-2deg);
    }

    75%{
        transform:
            translate(-9px,-9px)
            rotate(4deg);
    }
}


/* =========================================================
   BALLOON MESSAGE
========================================================= */

.balloon-message{
    position:absolute;

    width:205px;

    left:50%;
    top:30px;

    padding:15px 17px;

    background:
        rgba(255,255,255,.97);

    border:
        1px solid
        rgba(255,255,255,.9);

    border-radius:18px;

    color:#b72e63;

    font-family:Georgia,serif;

    font-size:14px;

    line-height:1.4;

    box-shadow:
        0 18px 45px
        rgba(85,30,55,.17);

    opacity:0;

    pointer-events:none;

    z-index:50;

    transform:
        translate(-50%,20px)
        scale(.3);

    transition:
        opacity .4s ease,

        transform
        .65s
        cubic-bezier(.16,1,.3,1);
}

.balloon-message::after{
    content:"";

    position:absolute;

    bottom:-9px;

    left:50%;

    transform:
        translateX(-50%);

    border-left:
        9px solid transparent;

    border-right:
        9px solid transparent;

    border-top:
        10px solid white;
}

.balloon.show-message .balloon-message{
    opacity:1;

    transform:
        translate(-50%,-112px)
        scale(1);
}


/* =========================================================
   BALLOON BURST
========================================================= */

.balloon.bursting{
    animation:none;

    transform:scale(1.18);

    transition:
        transform .15s ease;
}

.balloon.gone{
    opacity:0;

    transform:scale(.05);

    pointer-events:none;

    transition:
        opacity .25s ease,
        transform .3s ease;
}

.burst-piece{
    position:absolute;

    width:8px;
    height:12px;

    z-index:100;

    pointer-events:none;

    font-size:15px;

    animation:
        burstPiece
        .75s
        ease-out
        forwards;
}

@keyframes burstPiece{

    0%{
        opacity:1;

        transform:
            translate(0,0)
            rotate(0)
            scale(1);
    }

    100%{
        opacity:0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(500deg)
            scale(.2);
    }
}

.balloon-counter{
    display:inline-block;

    padding:7px 17px;

    background:
        rgba(255,255,255,.75);

    border:
        1px solid
        rgba(255,255,255,.8);

    border-radius:30px;

    color:#87616f;

    font-size:11px;
}


/* =========================================================
   CAKE
========================================================= */

.cake-heading{
    margin-bottom:4px;

    font-size:
        clamp(40px,11vw,58px);
}

.cake-subtitle{
    margin-top:5px;
}

.oyeee{
    min-height:80px;

    margin-bottom:2px;

    font-family:Georgia,serif;

    color:#b52e62;
}

.oyeee-line{
    display:block;

    opacity:0;

    transform:
        translateY(12px)
        scale(.95);

    animation:
        oyeeIn
        .7s
        forwards;
}

.oyeee-line:nth-child(1){
    animation-delay:.15s;
}

.oyeee-line:nth-child(2){
    animation-delay:.7s;
}

.oyeee-line:nth-child(3){
    animation-delay:1.25s;
}

.oyeee-line:nth-child(4){
    animation-delay:1.9s;
}

@keyframes oyeeIn{

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}

.oyeee-line:nth-child(3){
    font-size:20px;

    font-weight:bold;
}

.oyeee-line:nth-child(4){
    font-size:14px;

    color:#765967;
}

.cake{
    position:relative;

    width:280px;
    height:235px;

    margin:
        -2px auto
        -3px;
}

.plate{
    position:absolute;

    width:270px;
    height:24px;

    left:5px;
    bottom:22px;

    background:#dfa4b8;

    border-radius:50%;
}

.cake-body{
    position:absolute;

    width:215px;
    height:105px;

    left:32px;
    bottom:42px;

    background:
        linear-gradient(
            #f7b4ca,
            #df7fa5
        );

    border-radius:
        15px 15px 25px 25px;

    box-shadow:
        inset 0 -10px
        rgba(160,60,100,.07);
}

.frosting{
    position:absolute;

    width:215px;
    height:43px;

    top:-16px;

    background:#fffafd;

    border-radius:50%;
}

.cake-number{
    position:absolute;

    width:100%;

    top:35px;

    font-family:Georgia,serif;

    font-size:37px;

    font-weight:bold;

    color:#b42b5d;
}

.candle{
    position:absolute;

    width:16px;
    height:65px;

    bottom:143px;

    z-index:5;

    border-radius:5px;

    background:
        repeating-linear-gradient(
            135deg,
            white 0 8px,
            #ef8bab 8px 16px
        );

    transition:
        filter .1s linear;
}

.candle1{
    left:88px;
}

.candle2{
    left:132px;
}

.candle3{
    left:176px;
}

.flame{
    position:absolute;

    width:20px;
    height:29px;

    bottom:205px;

    z-index:7;

    background:
        linear-gradient(
            #fff36b,
            #ff8c20
        );

    border-radius:
        60% 40% 60% 40%;

    opacity:1;

    filter:
        brightness(1)
        drop-shadow(
            0 0 9px
            rgba(255,170,40,.85)
        );

    animation:
        flameFlicker
        .55s
        ease-in-out
        infinite alternate;

    transition:
        opacity .1s linear,
        filter .1s linear,
        transform .1s linear;
}

.flame1{
    left:86px;
}

.flame2{
    left:130px;
}

.flame3{
    left:174px;
}

@keyframes flameFlicker{

    from{
        transform:
            rotate(5deg)
            scale(1);
    }

    to{
        transform:
            rotate(-6deg)
            scale(.9);
    }
}

.flame.off{
    opacity:0 !important;

    filter:none !important;

    transform:scale(0) !important;

    animation:none !important;
}

.wind-label{
    font-size:13px;

    font-weight:bold;

    color:#6d4656;
}

#wind{
    width:min(90%,380px);

    margin-top:7px;

    accent-color:#c63168;

    cursor:pointer;
}

#windValue{
    margin-top:2px;

    color:#98727f;

    font-size:11px;
}


/* =========================================================
   CLOSE EYES PAGE
========================================================= */

#wish{
    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.96),
            rgba(250,210,225,.97)
        );
}

.wish-title{
    font-size:
        clamp(43px,12vw,62px);

    line-height:.98;

    margin-bottom:18px;
}

.wish-text{
    font-family:Georgia,serif;

    font-size:20px;

    line-height:1.6;
}

.drone{
    display:inline-block;

    margin-top:16px;

    padding:10px 18px;

    border-radius:30px;

    background:
        rgba(255,255,255,.75);

    color:#b52e62;

    font-size:14px;

    font-weight:bold;

    box-shadow:
        0 8px 22px
        rgba(100,30,60,.08);

    animation:
        droneFloat
        2s
        ease-in-out
        infinite;
}

@keyframes droneFloat{

    50%{
        transform:
            translateY(-5px)
            rotate(1deg);
    }
}


/* teddy covering eyes */

.wish-teddy .arm.left{
    transform:
        rotate(105deg);

    transform-origin:
        20px 10px;
}

.wish-teddy .arm.right{
    transform:
        rotate(-105deg);

    transform-origin:
        3px 10px;
}


/* =========================================================
   CANDLE MESSAGE
========================================================= */

.candle-message h1{
    font-size:
        clamp(46px,12vw,68px);

    line-height:.95;
}

.candle-message p{
    font-size:15px;

    line-height:1.75;
}

#candlesDone .teddy{
    transform:
        translateX(-50%)
        scale(.72);
}


/* =========================================================
   GIFT
========================================================= */

.gift-heading{
    margin-bottom:7px;

    font-size:
        clamp(40px,11vw,59px);

    line-height:1;
}


/* sunflower */

.sunflower{
    position:relative;

    width:125px;
    height:130px;

    margin:
        2px auto
        -2px;

    animation:
        flowerFloat
        3s
        ease-in-out
        infinite;
}

@keyframes flowerFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(0);
    }

    50%{
        transform:
            translateY(-5px)
            rotate(2deg);
    }
}

.petal{
    position:absolute;

    width:40px;
    height:58px;

    left:43px;
    top:22px;

    background:#ffca2d;

    border-radius:50%;

    transform-origin:
        20px 39px;
}

.petal:nth-child(1){
    transform:
        rotate(0deg)
        translateY(-24px);
}

.petal:nth-child(2){
    transform:
        rotate(45deg)
        translateY(-24px);
}

.petal:nth-child(3){
    transform:
        rotate(90deg)
        translateY(-24px);
}

.
